name: FIN-TRACK CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Backend CI (Spring Boot 3.5 / Java 21)
  # ---------------------------------------------------------------------------
  backend-ci:
    name: ☕ Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔑 Grant execute permission for mvnw
        run: chmod +x mvnw

      - name: 🛠️ Compile Backend Code
        run: ./mvnw compile

      - name: 🧪 Run Backend Unit Tests
        run: ./mvnw test

      - name: 📦 Package Spring Boot Application
        run: ./mvnw package -DskipTests

      - name: ⬆️ Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-backend-jar
          path: target/*.jar
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 2: Frontend CI (React 18 / Vite 5 / Node.js 20)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: ⚡ Frontend Build & Test (React + Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        run: npm ci || npm install

      - name: 🛠️ Build Frontend Bundle
        run: npm run build

      - name: ⬆️ Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Job 3: Docker Build Validation
  # ---------------------------------------------------------------------------
  docker-validation:
    name: 🐳 Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Validate Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: finance-tracker-api:latest
