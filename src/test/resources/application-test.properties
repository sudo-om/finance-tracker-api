# In-Memory H2 Database Configuration for Integration Testing & CI
spring.datasource.url=jdbc:h2:mem:fintrack;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Telegram Bot Config for Testing
telegram.bot.token=test-bot-token
telegram.bot.username=test_bot

