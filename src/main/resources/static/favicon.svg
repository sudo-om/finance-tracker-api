<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Neo-Brutalist Black Drop Shadow -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="#000000" />
  
  <!-- Main Neo-Brutalist Yellow Card with Thick Black Border -->
  <rect x="24" y="24" width="416" height="416" rx="80" fill="#FFE600" stroke="#000000" stroke-width="28" />
  
  <!-- Wallet Motif -->
  <g fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Strap -->
    <path d="M 136 160 V 136 C 136 114 154 96 176 96 H 288 C 310 96 328 114 328 136 V 160" />
    
    <!-- Main Wallet Body -->
    <rect x="88" y="160" width="288" height="200" rx="32" fill="#FFE600" />
    
    <!-- Clasp Pocket -->
    <path d="M 264 216 H 368 C 381.25 216 392 226.75 392 240 V 280 C 392 293.25 381.25 304 368 304 H 264 C 250.75 304 240 293.25 240 280 V 240 C 240 226.75 250.75 216 264 216 Z" fill="#FFE600" stroke-width="24" />
    
    <!-- Clasp Dot -->
